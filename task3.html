<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 – Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/task3.css">
</head>
<body class="t3-page">

<main class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card t3-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Reserve a table</h1>

          <!-- method="post": данные не попадают в адресную строку -->
          <form action="#" method="post">

            <!-- Было: только placeholder="Your name", без label и без name -->
            <div class="mb-3">
              <label for="name" class="form-label">Your name</label>
              <input type="text" class="form-control" id="name" name="name"
                     autocomplete="name" required>
            </div>

            <!-- Было: type="text" для email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email"
                     autocomplete="email" required>
            </div>

            <!-- Было: <label>Phone</label> без for, type="text" -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone" name="phone"
                     autocomplete="tel" required>
            </div>

            <div class="row g-3 mb-3">
              <!-- Было: label for="guests", а у input id="people" — связи нет -->
              <div class="col-sm-6">
                <label for="guests" class="form-label">Guests</label>
                <input type="number" class="form-control" id="guests" name="guests"
                       min="1" max="20" step="1" value="2" required>
              </div>
              <!-- Было: type="text" + placeholder "dd/mm/yyyy" -->
              <div class="col-sm-6">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
              </div>
            </div>

            <!-- Было: <p>Seating:</p>, у radio разные name и повторный id="date" -->
            <fieldset class="mb-3">
              <legend class="form-label fs-6 mb-2">Seating</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" checked>
                <label class="form-check-label" for="inside">Inside</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
                <label class="form-check-label" for="terrace">Terrace</label>
              </div>
            </fieldset>

            <!-- Было: select без label и без name -->
            <div class="mb-3">
              <label for="meal" class="form-label">Meal</label>
              <select class="form-select" id="meal" name="meal">
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
              </select>
            </div>

            <!-- Было: textarea только с placeholder -->
            <div class="mb-3">
              <label for="comments" class="form-label">Comments <span class="text-body-secondary">(optional)</span></label>
              <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
            </div>

            <!-- Было: текст рядом с checkbox не был label, не было required -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms" name="terms" value="yes" required>
              <label class="form-check-label" for="terms">I agree to the terms</label>
            </div>

            <!-- Было: <div class="btn btn-primary">Reserve</div> — не кнопка -->
            <button type="submit" class="btn btn-primary w-100 py-2">Reserve</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
