<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 – Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/task1.css">
</head>
<body class="t1-page">

<main class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <!-- Ширина карточки задаётся сеткой Bootstrap, а не фиксированными px -->
    <div class="col-12 col-lg-10">

      <!-- Компонент Card: card-header (зелёная шапка) + card-body -->
      <div class="card t1-card">
        <h1 class="card-header t1-header">Book a train ticket</h1>

        <div class="card-body t1-body">
          <form action="#" method="get">

            <!-- 1. "One way / Round trip": два radio + Bootstrap .btn-check внутри .btn-group.
                 Радио не скрыты через display:none, поэтому до них можно дойти Tab и переключать стрелками. -->
            <div class="btn-group t1-trip d-flex d-sm-inline-flex mb-4" role="group" aria-label="Trip type">
              <input type="radio" class="btn-check" name="trip" id="oneWay" value="one-way" checked>
              <label class="btn t1-trip-btn" for="oneWay">One way</label>

              <input type="radio" class="btn-check" name="trip" id="roundTrip" value="round-trip">
              <label class="btn t1-trip-btn" for="roundTrip">Round trip</label>
            </div>

            <!-- 2. From / To: Floating labels (.form-floating). Label стоит ПОСЛЕ input и нужен placeholder -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control t1-control" id="from" name="from"
                         placeholder="From" value="Astana" autocomplete="off" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control t1-control" id="to" name="to"
                         placeholder="To" value="Almaty" autocomplete="off" required>
                  <label for="to">To</label>
                </div>
              </div>
            </div>

            <!-- 3. Даты и пассажиры: на телефоне в столбик, с 768px (md) — три колонки -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="departure" class="form-label t1-label">Departure</label>
                <input type="date" class="form-control t1-control" id="departure" name="departure" required>
              </div>
              <div class="col-md-4">
                <label for="return" class="form-label t1-label">Return</label>
                <input type="date" class="form-control t1-control" id="return" name="return">
              </div>
              <div class="col-md-4">
                <label for="passengers" class="form-label t1-label">Passengers</label>
                <!-- select: можно выбрать только 1–6, другое значение ввести нельзя -->
                <select class="form-select t1-control" id="passengers" name="passengers">
                  <option value="1">1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>
            </div>

            <!-- 4. Carriage class: группа radio. fieldset + legend = общая подпись для группы -->
            <fieldset class="mb-3">
              <legend class="form-label t1-label fs-6 mb-2">Carriage class</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
                <label class="form-check-label" for="coupe">Coupé</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </fieldset>

            <!-- 5. Phone (Input group с "+7") и Email -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="phone" class="form-label t1-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text t1-prefix">+7</span>
                  <input type="tel" class="form-control t1-control" id="phone" name="phone"
                         placeholder="701 234 56 78" autocomplete="tel" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label t1-label">Email</label>
                <input type="email" class="form-control t1-control" id="email" name="email"
                       placeholder="name@example.com" autocomplete="email" required>
              </div>
            </div>

            <!-- 6. Switch (.form-switch) — это тот же checkbox, только выглядит как переключатель -->
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>

            <!-- 7. Обычный checkbox, обязательный -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
              <label class="form-check-label" for="agree">I agree with the carriage rules</label>
            </div>

            <!-- 8. Кнопки. В HTML порядок: Clear, Find trains.
                 На телефоне flex-column-reverse переворачивает их => Find trains сверху.
                 С 576px (sm) flex-sm-row ставит их в строку и прижимает вправо. -->
            <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3">
              <button type="reset" class="btn t1-btn t1-btn-clear">Clear</button>
              <button type="submit" class="btn t1-btn t1-btn-find">Find trains</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</main>

</body>
</html>
